# Module manifest: the single source of truth for what gets installed where.
#
# Format, one link per line, pipe separated:
#
#   module | source (repo-relative) | target | platforms (comma separated)
#
# Platforms:
#   macos    macOS, zsh
#   gitbash  Windows, Git Bash
#   wsl      WSL, bash
#   windows  Windows, PowerShell
#
# Target tokens, expanded by the installer for the running platform:
#   ~                 home directory
#   {{PSPROFILE}}     $PROFILE.CurrentUserAllHosts
#
# Why a flat text file rather than JSON: install.sh, install.ps1, and check.sh
# all parse it, and this format needs no dependency in either bash or
# PowerShell. jq is not installed everywhere, and hand-parsing JSON in bash is
# worse than the problem it solves.
#
# scripts/check.sh verifies every source path here exists, so the manifest and
# the tree cannot drift.

# ---------- shell ----------
# One rc file per platform, each of which sources shared/shell/init.sh. Git Bash
# needs both bashrc and bash_profile: a Git Bash window starts a login shell,
# which reads bash_profile and not bashrc, so bash_profile exists to source the
# other one and keep a single entry point.
shell   | macos/zshrc                              | ~/.zshrc                          | macos
shell   | windows/bashrc                           | ~/.bashrc                         | gitbash
shell   | windows/bash_profile                     | ~/.bash_profile                   | gitbash
shell   | wsl/bashrc                               | ~/.bashrc                         | wsl
shell   | windows/Microsoft.PowerShell_profile.ps1 | {{PSPROFILE}}                     | windows

# ---------- prompt ----------
# macOS and WSL share one starship config, which is why it lives in shared/;
# Windows has its own. See the comments in windows/starship.toml for the three
# places they differ.
prompt  | shared/starship.toml                     | ~/.config/starship.toml           | macos,wsl
prompt  | windows/starship.toml                    | ~/.config/starship.toml           | gitbash,windows

# ---------- git ----------
# One file for all four platforms: every setting in it is either universal or
# ignored by the platforms it does not apply to. It carries no identity, and
# includes an untracked ~/.gitconfig.local last so identity stays out of this
# repository. ~/.config/git/ignore is the path git reads for a global ignore
# file with no configuration pointing at it.
git     | shared/git/gitconfig                     | ~/.gitconfig                      | macos,gitbash,wsl,windows
git     | shared/git/ignore                        | ~/.config/git/ignore              | macos,gitbash,wsl,windows

# ---------- claude ----------
# The two files Claude Code reads at user scope, on every platform: one memory
# file and one settings file. Both are the same on all four, because neither
# names a path, a shell, or a machine.
#
# Unlike every other module here, this one has no machine-local sibling to fall
# back on. Claude Code reads exactly one settings file at user scope, and a
# settings.local.json placed next to it is ignored; the overlay slots it does
# read are per project. So anything private stays out of these two files and
# goes in a project's own .claude/settings.local.json instead.
#
# Not linked, deliberately: hooks/, agents/, skills/, and a statusline command
# all need a language runtime, and this repository does not ask for one. MCP
# servers cannot be linked at all: user scope keeps them in ~/.claude.json, a
# file Claude Code rewrites, so a symlink there is replaced by a real copy on
# the first write. ~/.claude also holds session state and caches next to these
# two files, which is why the module links the files and not the directory.
claude  | shared/claude/CLAUDE.md                  | ~/.claude/CLAUDE.md               | macos,gitbash,wsl,windows
claude  | shared/claude/settings.json              | ~/.claude/settings.json           | macos,gitbash,wsl,windows
